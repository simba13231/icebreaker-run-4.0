<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#061826" />
  <meta name="description" content="Icebreaker Run — dodge icebergs across three lanes in this endless arcade boat game." />
  <title>Icebreaker Run</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="game-root">
    <canvas id="game-canvas" aria-hidden="true"></canvas>

    <!-- HUD (visible during gameplay) -->
    <div id="hud">
      <div class="hud-scores" aria-live="polite">
        <div class="row"><span class="label">Score</span><span class="value" id="hud-score">0</span></div>
        <div class="row"><span class="label">Best</span><span class="value" id="hud-best">0</span></div>
      </div>
      <div class="hud-actions">
        <button id="btn-pause" class="btn btn--icon" aria-label="Pause game">⏸</button>
      </div>
    </div>

    <!-- Mute toggle (always reachable) -->
    <button id="btn-mute" class="btn btn--icon" aria-label="Toggle sound" aria-pressed="false">🔊</button>

    <!-- Main Menu -->
    <section id="screen-menu" class="screen visible" aria-label="Main menu">
      <div class="panel">
        <h1 class="title">ICEBREAKER<br /><span class="title-accent">RUN</span></h1>
        <p class="subtitle">Dodge the ice. Outrun the cold.</p>

        <div class="menu-score">
          <span class="label">High Score</span>
          <span class="value" id="menu-high-score">0</span>
        </div>

        <button id="btn-play" class="btn btn--primary">▶ PLAY</button>
        <button id="btn-settings-open" class="btn btn--secondary">⚙ SETTINGS</button>
      </div>
    </section>

    <!-- Pause Screen -->
    <section id="screen-pause" class="screen screen--overlay" aria-label="Paused">
      <div class="panel">
        <h2 class="title" style="font-size: 2rem;">PAUSED</h2>
        <div class="button-stack">
          <button id="btn-resume" class="btn btn--primary">▶ RESUME</button>
          <button id="btn-pause-main-menu" class="btn btn--secondary">MAIN MENU</button>
        </div>
      </div>
    </section>

    <!-- Game Over Screen -->
    <section id="screen-gameover" class="screen screen--overlay" aria-label="Game over">
      <div class="panel">
        <span id="new-record-badge" class="badge">★ NEW HIGH SCORE!</span>
        <h2 class="title" style="font-size: 2.2rem;">GAME OVER</h2>
        <div class="score-grid">
          <div class="score-block">
            <span class="label">Score</span>
            <span class="value" id="gameover-score">0</span>
          </div>
          <div class="score-block">
            <span class="label">Best</span>
            <span class="value" id="gameover-best">0</span>
          </div>
        </div>
        <div class="button-stack">
          <button id="btn-play-again" class="btn btn--primary">↻ PLAY AGAIN</button>
          <button id="btn-gameover-main-menu" class="btn btn--secondary">MAIN MENU</button>
        </div>
      </div>
    </section>

    <!-- Settings Screen -->
    <section id="screen-settings" class="screen screen--overlay" aria-label="Settings">
      <div class="panel">
        <div class="settings-header">
          <h2 class="title" style="font-size: 1.6rem;">SETTINGS</h2>
          <button id="btn-settings-close" class="btn btn--icon" aria-label="Close settings">✕</button>
        </div>

        <div class="settings-list">
          <div class="settings-row">
            <span class="settings-label">Sound Effects</span>
            <label class="switch">
              <input type="checkbox" id="toggle-sfx" checked />
              <span class="track"></span>
            </label>
          </div>
          <div class="settings-row">
            <span class="settings-label">Background Music</span>
            <label class="switch">
              <input type="checkbox" id="toggle-music" checked />
              <span class="track"></span>
            </label>
          </div>
          <div class="settings-row">
            <span class="settings-label">Touch Controls</span>
            <label class="switch">
              <input type="checkbox" id="toggle-touch" checked />
              <span class="track"></span>
            </label>
          </div>
          <div class="settings-row">
            <span class="settings-label">Reduced Effects</span>
            <label class="switch">
              <input type="checkbox" id="toggle-reduced-fx" />
              <span class="track"></span>
            </label>
          </div>
        </div>
      </div>
    </section>

    <!-- On-screen touch controls -->
    <div id="touch-controls">
      <button id="btn-left" class="touch-btn" aria-label="Move left">◀</button>
      <button id="btn-right" class="touch-btn" aria-label="Move right">▶</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
